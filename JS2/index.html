<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Web Output #3</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Javascript Web Output #3</h1>

        <div class="buttons">
            <button id="loadBtn">Load data from the API</button>
            <button id="clearBtn">Clear Table</button>
        </div>

        <p class="api-text">
            API:
            <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank">
                https://jsonplaceholder.typicode.com/todos/
            </a>
        </p>

        <table id="todoTable">
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Task ID</th>
                    <th>Title</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <!-- API data will appear here -->
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
