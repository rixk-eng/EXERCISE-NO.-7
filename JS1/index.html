<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Javascript Web Output #2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Javascript Web Output #2</h1>

    <div class="form-container">

        <div class="form-row">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName">
        </div>

        <div class="form-row">
            <label for="middleName">Middle Name:</label>
            <input type="text" id="middleName">
        </div>

        <div class="form-row">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName">
        </div>

        <div class="form-row">
            <label for="age">Age:</label>
            <input type="number" id="age">
        </div>

        <div class="buttons">
            <button id="mainButton" onclick="insertOrUpdate()">
                Insert
            </button>

            <button onclick="clearInputs()">
                Clear
            </button>
        </div>

    </div>


    <fieldset class="records-box">

        <legend>Records</legend>

        <p id="noRecords">No Records...</p>

        <div class="table-container">

            <table id="recordsTable">

                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Middle Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="recordsBody"></tbody>

            </table>

        </div>

    </fieldset>


    <div class="bottom-controls">

        <button onclick="clearRecords()">
            Clear Records
        </button>

        <label for="sortField">
            Sort by:
        </label>

        <select id="sortField" onchange="sortRecords()">
            <option value="firstName">First Name</option>
            <option value="middleName">Middle Name</option>
            <option value="lastName" selected>Last Name</option>
            <option value="age">Age</option>
        </select>

        <select id="sortOrder" onchange="sortRecords()">
            <option value="asc">A-Z</option>
            <option value="desc">Z-A</option>
        </select>

        <button onclick="saveToLocalStorage()">
            Save to Local Storage
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
